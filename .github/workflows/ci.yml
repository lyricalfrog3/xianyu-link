name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n xianyu-link
          bash -n install.sh

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning xianyu-link install.sh

      - name: CLI contract (no device required)
        run: |
          ./xianyu-link --version
          ./xianyu-link --help
          # These must fail cleanly without a device, not hang or crash.
          if ./xianyu-link --print; then
            echo "expected failure without a device"; exit 1
          fi

      - name: Bash 3.2 compatibility (macOS default shell)
        run: |
          # Reject constructs that only exist in bash 4+.
          if grep -nE 'declare -A|mapfile|readarray|local -[A-Z]|&>>|\$\{[a-zA-Z_]+(,,|\^\^)' xianyu-link; then
            echo "bash 4+ only construct found"; exit 1
          fi
